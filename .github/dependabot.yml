version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    allow:
      - dependency-type: "direct"
    groups:
      # init/autobuild/analyze are separate step references into the same
      # action repo and must stay version-matched -- an ungrouped update
      # can bump one and leave the others behind, breaking CodeQL with
      # "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    reviewers:
      - "jp-cruz"
    assignees:
      - "jp-cruz"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    allow:
      - dependency-type: "all"
    reviewers:
      - "jp-cruz"
    assignees:
      - "jp-cruz"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
