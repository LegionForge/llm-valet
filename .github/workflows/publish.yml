name: Publish to PyPI

# Triggered by pushing a version tag (e.g. git tag v0.6.0 && git push --tags).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in secrets.
# Configure the trusted publisher at https://pypi.org/manage/project/llm-valet/settings/
# before pushing the first tag:
#   Publisher: GitHub Actions
#   Repository: LegionForge/llm-valet
#   Workflow: publish.yml
#   Environment: pypi
#
# Every action below is pinned to a commit SHA, not a floating tag -- a
# moved tag (especially pypa/gh-action-pypi-publish's `release/v1`, which
# is a BRANCH, not a tag, so more mutable than usual) is a real
# supply-chain vector for a workflow that publishes to PyPI. Same fix
# already applied to LegionForge/convobox's publish.yml. Resolved 2026-08-06:
#   actions/checkout@v7                    -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python@v6                -> ece7cb06caefa5fff74198d8649806c4678c61a1
#   actions/upload-artifact@v7             -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8           -> 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   pypa/gh-action-pypi-publish@release/v1 -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatchling build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
